# phase6.yml — the phase-6 full-pipeline CI (D-16) + the USPACE-10
# x86_64 9k pool-panic verdict leg (D-04).  A SIBLING of r9-shell.yml
# and the legacy harvey.yml — both byte-untouched.  A clean checkout of
# this repo runs every gate phase 6 built, on ubuntu-latest:
#
#   wave0-host  (fast, 45m): host toolchain → the gethunk ×2 repro gates
#               (archive mode rebuilds the recorded PREREF pristine
#               compilers from git — the teeth proof — then verify
#               asserts the hang signature on them and green on the
#               fixed hostbin pair, USPACE-01) → the coverage report
#               regenerated IN PLACE and `git diff --exit-code`d (the
#               working tree vs the committed copy IS the drift signal —
#               D-15, USPACE-02) → the generator .7-magic scan
#               (USPACE-03's mechanical red) → the grep-hygiene gate
#               (D-02) → the FPdbleword region assert (D-01).
#   tier-donor  (slow, 90m): subset-build.sh + subset-exec.sh on the
#               native-linux venue (NATIVE_LINUX engages by uname:
#               nsrun sudo-unshare, donor clone pin-verified to
#               350266104f host-side, TCG aarch64 qemu) — the tier-0/1
#               donor execution gate (USPACE-04's first venue).
#   tier-r9     (slow, 90m): nix run .#boot-r9-tier1 — the tier-1 sweep
#               on the flake.lock-pinned r9 kernel (06-07's app;
#               USPACE-04's second venue, D-12).  TCG on the runner.
#   x86_64-poolpanic (45m): USPACE-10's re-test (D-04) — `nix run
#               .#build` builds 9k10cpu from the clean checkout (the
#               pswt-fixed 6c is guaranteed by the clean toolchain
#               build), then build/mm/boot-9k10cpu-qemu.sh boots it
#               under PLAIN qemu (no minimega — D-03) with the serial
#               capture file-attached at launch and classifies the
#               WHOLE log against the recorded 01-04 signature set
#               (bad magic / panic / suicide: sys: trap).  The job
#               asserts verdict PRODUCTION (the verdict file exists
#               with a VERDICT= line — banner seen + classification
#               written), NEVER the outcome: a recorded VERDICT=FAIL
#               closes USPACE-10 with information.  An empty capture
#               records FAIL no-banner and the leg reds.  KVM when
#               /dev/kvm is writable (ubuntu-latest exposes it), else
#               the TCG fallback (-cpu qemu64, 600s budgets) — the
#               probe runs exactly once per run and the classification
#               set is identical on both paths.
#
# CI-green means LINUX only — the darwin leg is documented-manual
# (build/REPRODUCIBILITY.md names the exact commands); no darwin leg
# runs here (the r9-shell.yml precedent).
#
# Supply chain: EVERY action below is pinned to a full 40-char commit
# SHA, never a floating tag (r9-shell.yml:35's `@v4` checkout is NOT
# repeated — CONCERNS IN-06):
#   actions/checkout v4                          = 11d5960a326750d5838078e36cf38b85af677262
#   DeterminateSystems/nix-installer-action v23  = 3138316df39ed29be04236d7ffc686fa525866aa
#   actions/upload-artifact v4                   = ea165f8d65b6e75b540449e92b4886f43607fa02
# (checkout + upload-artifact resolved via the GitHub API
# git/refs/tags/<tag> at authoring time, 2026-11-05; the
# nix-installer-action pin is the 05-13 pin.)
# Permissions are the default checkout scope (contents: read) — the
# pipeline builds and boots locally; no extra tokens or secrets.
# A concurrency group cancels superseded runs — 90-min TCG serial legs
# would otherwise amplify on every push (T-06-18).

name: phase6-userspace

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: phase6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wave0-host:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # Full history: the gethunk repro gates' archive mode runs
          # `git archive $PREREF` against the recorded pre-fix ref —
          # the default shallow checkout (fetch-depth 1) lacks the
          # object and the gates red in seconds.
          fetch-depth: 0
      - name: install nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa
      - name: host bin bootstrap (pcc + plan9port userland)
        # toolchain.sh hard-requires $HARVEY_LINUX_BIN/pcc — on a clean
        # runner hostbin-linux-x86_64/ does not exist yet (local
        # validation never saw this: the dev hosts' hostbin dirs were
        # populated long ago).
        run: nix run .#setup
      - name: host toolchain (hostbin 6c/7c + plan9port)
        run: nix run .#toolchain
      - name: gethunk repro gates (USPACE-01)
        # archive mode builds the teeth (the recorded PREREF pristine
        # compilers) from git — CI-durable from any later checkout;
        # verify asserts RED on them + GREEN on the fixed hostbin pair.
        # Evidence channel: on failure the captured log tail lands in
        # the step summary (API-readable; runner logs are auth-gated).
        run: |
          mkdir -p .build
          log=.build/wave0-gethunk.log
          : > "$log"
          for c in "gethunk-repro-cc.sh archive" "gethunk-repro-cc.sh verify" "gethunk-repro-6l.sh archive" "gethunk-repro-6l.sh verify"; do
            echo "== $c" | tee -a "$log"
            nix develop -c sh "build/aarch64/$c" >>"$log" 2>&1 || {
              rc=$?
              echo "GETHUNK-GATE-FAIL: $c rc=$rc" | tee -a "$log"
              { echo "## ❌ gethunk repro gate failed: \`$c\` (rc=$rc)"; echo '```'; tail -80 "$log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
              exit $rc
            }
          done
          echo "GETHUNK-GATES-OK" | tee -a "$log"
      - name: coverage report regen + drift diff (USPACE-02, D-15)
        # Regenerate IN PLACE — intentionally range-less: the working
        # tree vs the committed copy IS the drift signal.
        # Evidence channel: step summary on failure (API-readable).
        run: |
          mkdir -p .build
          log=.build/wave0-coverage.log
          : > "$log"
          nix develop -c sh build/aarch64/coverage-sweep.sh >>"$log" 2>&1 || {
            rc=$?
            echo "COVERAGE-SWEEP-FAIL rc=$rc" | tee -a "$log"
            { echo "## ❌ coverage sweep failed (rc=$rc)"; echo '```'; tail -80 "$log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit $rc
          }
          tail -5 "$log"
          if ! git diff --exit-code build/aarch64/dir-coverage.txt > "$log.diff" 2>&1; then
            { echo "## ❌ coverage drift diff (committed report vs regen on $(uname -m))"; echo '```'; head -80 "$log.diff"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "COVERAGE-DIFF-CLEAN ($(uname -m))"
      - name: generator .7-magic scan (USPACE-03)
        run: nix develop -c sh build/aarch64/generator-scan.sh
      - name: grep-hygiene gate (D-02)
        # No absolute-path grep CALL shape survives in
        # build/aarch64/*.sh.  The sanctioned idiom is the per-script
        # `GREP=$(command -v /usr/bin/grep || command -v grep)`
        # resolution line (and its comments) — the forbidden shape is
        # an INVOCATION: the absolute path followed by flags.
        run: |
          if grep -nE '/usr/bin/grep[[:space:]]+-' build/aarch64/*.sh; then
            echo "GREP-HYGIENE-FAIL: absolute-path grep call shape survives" >&2
            exit 1
          fi
          echo "GREP-HYGIENE-OK"
      - name: FPdbleword region assert (D-01)
        # Sed the union region out of aarch64/include/u.h and require
        # exactly the two uint members (the amd64 reference shape);
        # any surviving ulong member is red.
        run: |
          region=$(sed -n '/^union FPdbleword/,/^};/p' aarch64/include/u.h)
          n=$(printf '%s\n' "$region" | grep -cE '^[[:space:]]+uint[[:space:]]+(lo|hi);')
          if [ "$n" -ne 2 ]; then
            echo "FPDBL-FAIL: want exactly the uint lo/hi members, found $n" >&2
            exit 1
          fi
          if printf '%s\n' "$region" | grep -q 'ulong'; then
            echo "FPDBL-FAIL: a ulong member survives in FPdbleword" >&2
            exit 1
          fi
          echo "FPDBL-OK"

  tier-donor:
    runs-on: ubuntu-latest
    timeout-minutes: 90 # TCG aarch64 scale; the gate's own BOOT_BUDGET localizes failures
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: install nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa
      - name: tier-0/1 build (native-linux namespace)
        # NATIVE_LINUX engages by uname: nsrun.sh sudo-unshare, host
        # toolchain auto-bootstraps via nix run .#setup / .#toolchain.
        run: nix develop -c sh build/aarch64/subset-build.sh
      - name: tier-0/1 donor execution gate (TCG aarch64)
        # Native-linux donor venue (Pitfall P6-4): the donor clone +
        # pin-verify 350266104f runs host-side; the rebake runs in the
        # host's own mount namespace; qemu aarch64 under TCG.
        run: nix develop -c sh build/aarch64/subset-exec.sh
      - name: upload the gate logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tier-donor-logs
          path: |
            .build/subset-build.log
            .build/9front-dist/subset-exec.log
            .build/9front-dist/subset-rebake.log
          if-no-files-found: warn

  tier-r9:
    runs-on: ubuntu-latest
    timeout-minutes: 90 # TCG scale; the driver's per-stage 600s timeouts localize failures
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: install nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa
      - name: tier-1 r9 gate (boot-r9-tier1)
        run: nix run .#boot-r9-tier1
      - name: upload the retained gate log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tier-r9-log
          path: build/aarch64/tier1-r9.log
          if-no-files-found: warn

  x86_64-poolpanic:
    runs-on: ubuntu-latest
    timeout-minutes: 45 # KVM when available; the script's own budgets localize TCG
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: install nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa
      - name: host bin + toolchain provisioning
        # nix/build.sh asserts pcc/cpp/ar in $HARVEY_LINUX_BIN before
        # building — provision them on the clean runner (same missing
        # prerequisite class as wave0-host's setup step).
        run: |
          nix run .#setup
          nix run .#toolchain
      - name: build 9k10cpu from the clean checkout (pswt-fixed 6c)
        run: nix run .#build
      - name: accel probe (recorded in the verdict file)
        # KVM iff /dev/kvm is writable, else TCG — exactly once per
        # run; the classification assertion set is identical on both
        # paths (the script probes again for its own run; this step
        # surfaces the runner's capability in the job log).
        run: |
          if [ -w /dev/kvm ]; then
            echo "accel=kvm (/dev/kvm writable)"
          else
            echo "accel=tcg (no writable /dev/kvm — 600s budgets)"
          fi
      - name: boot 9k10cpu + produce the verdict (USPACE-10)
        # The harness exits 0 iff a verdict was PRODUCED (banner seen +
        # classification written) — never gated on PASS.  No banner
        # (incl. an empty capture) records FAIL no-banner and reds the
        # leg.  The assert below is the job's verdict-production gate.
        run: |
          nix develop -c sh build/mm/boot-9k10cpu-qemu.sh
          test -f .build/poolpanic-verdict.txt
          grep -q '^VERDICT=' .build/poolpanic-verdict.txt
          cat .build/poolpanic-verdict.txt
      - name: upload the serial log + verdict
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: poolpanic-verdict
          path: |
            .build/poolpanic-serial.log
            .build/poolpanic-verdict.txt
          if-no-files-found: warn
