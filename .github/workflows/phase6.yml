# phase6.yml — the phase-6 full-pipeline CI (D-16) + the USPACE-10
# x86_64 9k pool-panic verdict leg (D-04).  A SIBLING of r9-shell.yml
# and the legacy harvey.yml — both byte-untouched.  A clean checkout of
# this repo runs every gate phase 6 built, on ubuntu-latest:
#
#   wave0-host  (fast, 45m): host toolchain → the gethunk ×2 repro gates
#               (archive mode rebuilds the recorded PREREF pristine
#               compilers from git — the teeth proof — then verify
#               asserts the hang signature on them and green on the
#               fixed hostbin pair, USPACE-01) → the coverage report
#               regenerated IN PLACE and `git diff --exit-code`d (the
#               working tree vs the committed copy IS the drift signal —
#               D-15, USPACE-02) → the generator .7-magic scan
#               (USPACE-03's mechanical red) → the grep-hygiene gate
#               (D-02) → the venue pin (the 9front tier-leg retirement
#               is CI-asserted, not prose — G-06-1) → the FPdbleword
#               region assert (D-01).
#   tier-9k     (slow, 90m): the Harvey-kernel tier venue (06-09,
#               G-06-1) — host setup + toolchain + the full amd64 build,
#               then the k10t1 embedded-root kernel (k10cpu's proven
#               device set + the 43-file tier-1 set + the D-10 sweep
#               baked into devroot) built by build/mm/build-9k10t1.sh,
#               booted + swept + asserted host-side by
#               build/mm/boot-9k10t1-sweep.sh under PLAIN qemu (no
#               minimega — D-03; KVM when /dev/kvm is writable, else the
#               TCG fallback).  The x86_64 CI tier venue: the tier-1
#               sweep runs on Harvey's OWN kernel (USPACE-04).
#   tier-r9     (slow, 90m): nix run .#boot-r9-tier1 — the tier-1 sweep
#               on the flake.lock-pinned r9 kernel (06-07's app;
#               USPACE-04's second CI venue, D-12).  TCG on the runner.
#   tier-2      (45m): the services-tier COMPILE gate (15-01,
#               USPACE-07's compile half) — host-only: setup + toolchain
#               + build/x86_64/subset-build.sh (tiers 0-2 in the Plan 9
#               namespace), asserting TIER-BUILD-OK and T2-ART marker
#               parity against tiers/tier2-services.txt (mk exit status
#               never trusted — markers are the gate).  No execution
#               legs here: per the Phase-14 venue precedent the donor/r9
#               services gates are self-provisioned/nix-driven local
#               gates (15-02/15-03).
#   x86_64-poolpanic (45m): USPACE-10's re-test (D-04) — `nix run
#               .#build` builds 9k10cpu from the clean checkout (the
#               pswt-fixed 6c is guaranteed by the clean toolchain
#               build), then build/mm/boot-9k10cpu-qemu.sh boots it
#               under PLAIN qemu (no minimega — D-03) with the serial
#               capture file-attached at launch and classifies the
#               WHOLE log against the recorded 01-04 signature set
#               (bad magic / panic / suicide: sys: trap).  The job
#               asserts verdict PRODUCTION (the verdict file exists
#               with a VERDICT= line — banner seen + classification
#               written), NEVER the outcome: a recorded VERDICT=FAIL
#               closes USPACE-10 with information.  An empty capture
#               records FAIL no-banner and the leg reds.  KVM when
#               /dev/kvm is writable (ubuntu-latest exposes it), else
#               the TCG fallback (-cpu qemu64, 600s budgets) — the
#               probe runs exactly once per run and the classification
#               set is identical on both paths.
#
# Venue split (G-06-1; CR-01 closed by retirement; maintainer direction
# 2026-11-05): on x86_64 CI the tier donor evidence comes from Harvey's
# OWN kernel (9k10cpu lineage — proven booting on the runner by the
# poolpanic leg), never 9front — borrowing 9front-specific design
# decisions is the deliberate anti-goal.  The aarch64 tier gates stay
# LOCAL-only (the 9front donor pin, driven by hand from
# build/aarch64/); tier-r9 remains the second CI venue (D-12).  The
# wave0-host venue-pin step negative-greps the retired leg's job key
# and its gate-script basenames, so a silent reintroduction of a hosted
# 9front dependency reds the fast leg.
#
# CI-green means LINUX only — the darwin leg is documented-manual
# (build/REPRODUCIBILITY.md names the exact commands); no darwin leg
# runs here (the r9-shell.yml precedent).
#
# Supply chain: EVERY action below is pinned to a full 40-char commit
# SHA, never a floating tag (r9-shell.yml:35's `@v4` checkout is NOT
# repeated — CONCERNS IN-06):
#   actions/checkout v4                          = 11d5960a326750d5838078e36cf38b85af677262
#   DeterminateSystems/nix-installer-action v23  = 3138316df39ed29be04236d7ffc686fa525866aa
#   actions/upload-artifact v4                   = ea165f8d65b6e75b540449e92b4886f43607fa02
# (checkout + upload-artifact resolved via the GitHub API
# git/refs/tags/<tag> at authoring time, 2026-11-05; the
# nix-installer-action pin is the 05-13 pin.)
# Permissions are the default checkout scope (contents: read) — the
# pipeline builds and boots locally; no extra tokens or secrets.
# A concurrency group cancels superseded runs — 90-min TCG serial legs
# would otherwise amplify on every push (T-06-18).

name: phase6-userspace

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: phase6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wave0-host:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # Full history: the gethunk repro gates' archive mode runs
          # `git archive $PREREF` against the recorded pre-fix ref —
          # the default shallow checkout (fetch-depth 1) lacks the
          # object and the gates red in seconds.
          fetch-depth: 0
      - name: install nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa
      - name: host bin bootstrap (pcc + plan9port userland)
        # toolchain.sh hard-requires $HARVEY_LINUX_BIN/pcc — on a clean
        # runner hostbin-linux-x86_64/ does not exist yet (local
        # validation never saw this: the dev hosts' hostbin dirs were
        # populated long ago).
        run: nix run .#setup
      - name: host toolchain (hostbin 6c/7c + plan9port)
        # toolchain.sh's trailing echo masks sub-build failures (same
        # exit-0 class as 02-12) — assert the products explicitly. iar-as-ar
        # comes from the vendored 9cc leg and is the first thing to check
        # when a downstream mk recipe invokes bare `ar`.
        run: |
          nix run .#toolchain
          _a=$(uname -m); [ "$_a" = "arm64" ] && _a=aarch64
          hb=".build/hostbin-linux-$_a/bin"
          missing=0
          for t in pcc cpp ar 6c 6l 8c 8l; do
            if [ ! -x "$hb/$t" ]; then echo "TOOLCHAIN-MISSING: $hb/$t" >&2; missing=1; fi
          done
          if [ "$missing" -ne 0 ]; then echo "hostbin contents:" >&2; ls "$hb" >&2; exit 1; fi
          echo "TOOLCHAIN-PRODUCTS-OK ($hb)"
      - name: gethunk repro gates (USPACE-01)
        # archive mode builds the teeth (the recorded PREREF pristine
        # compilers) from git — CI-durable from any later checkout;
        # verify asserts RED on them + GREEN on the fixed hostbin pair.
        # Evidence channel: on failure the captured log tail lands in
        # the step summary (API-readable; runner logs are auth-gated).
        run: |
          mkdir -p .build
          log=.build/wave0-gethunk.log
          : > "$log"
          for c in "gethunk-repro-cc.sh archive" "gethunk-repro-cc.sh verify" "gethunk-repro-6l.sh archive" "gethunk-repro-6l.sh verify"; do
            set -- $c
            echo "== $c" | tee -a "$log"
            nix develop -c sh "build/aarch64/$1" "$2" >>"$log" 2>&1 || {
              rc=$?
              echo "GETHUNK-GATE-FAIL: $c rc=$rc" | tee -a "$log"
              { echo "## ❌ gethunk repro gate failed: \`$c\` (rc=$rc)"; echo '```'; tail -80 "$log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
              exit $rc
            }
          done
          echo "GETHUNK-GATES-OK" | tee -a "$log"
      - name: coverage report regen + drift diff (USPACE-02, D-15)
        # Regenerate IN PLACE — intentionally range-less: the working
        # tree vs the committed copy IS the drift signal.
        # Evidence channel: step summary on failure (API-readable).
        run: |
          mkdir -p .build
          log=.build/wave0-coverage.log
          : > "$log"
          nix develop -c sh build/aarch64/coverage-sweep.sh >>"$log" 2>&1 || {
            rc=$?
            echo "COVERAGE-SWEEP-FAIL rc=$rc" | tee -a "$log"
            { echo "## ❌ coverage sweep failed (rc=$rc)"; echo '```'; tail -80 "$log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit $rc
          }
          tail -5 "$log"
          # Drift gate: committed report vs regen, with per-dir visit COUNTS
          # normalized out — the count jitters with watchdog/second-chance
          # timing on the build host class (runner: jpg visited=3; lima:
          # visited=1; verdict ok both). The reach set + build verdicts are
          # the drift signal; count jitter is measurement noise.
          git show HEAD:build/aarch64/dir-coverage.txt > .build/dc-committed.txt
          sed -E 's/visited=[0-9]+/visited=N/g' .build/dc-committed.txt > .build/dc-a.norm
          sed -E 's/visited=[0-9]+/visited=N/g' build/aarch64/dir-coverage.txt > .build/dc-b.norm
          if ! diff -u .build/dc-a.norm .build/dc-b.norm > "$log.diff" 2>&1; then
            { echo "## ❌ coverage drift diff (committed report vs regen on $(uname -m), visit counts normalized)"; echo '```'; head -80 "$log.diff"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "COVERAGE-DIFF-CLEAN ($(uname -m), visit counts normalized)"
      - name: generator .7-magic scan (USPACE-03)
        run: nix develop -c sh build/aarch64/generator-scan.sh
      - name: grep-hygiene gate (D-02)
        # No absolute-path grep CALL shape survives in
        # build/aarch64/*.sh.  The sanctioned idiom is the per-script
        # `GREP=$(command -v /usr/bin/grep || command -v grep)`
        # resolution line (and its comments) — the forbidden shape is
        # an INVOCATION: the absolute path followed by flags.
        run: |
          if grep -nE '/usr/bin/grep[[:space:]]+-' build/aarch64/*.sh; then
            echo "GREP-HYGIENE-FAIL: absolute-path grep call shape survives" >&2
            exit 1
          fi
          echo "GREP-HYGIENE-OK"
      - name: venue pin (tier-donor retired 2026-11-05)
        # Maintainer direction 2026-11-05 (G-06-1, CR-01): on x86_64 CI
        # the tier donor evidence comes from Harvey's OWN kernel — the
        # 9front tier leg is RETIRED (removed, not kept red: a
        # permanently-red leg trains red-blindness; this step is the
        # honest tripwire).  A future edit reintroducing a hosted 9front
        # dependency reds the fast leg here.  Self-hosting-safe: the
        # anchored job-key greps require line-start + exactly two spaces
        # (this run block's lines are indented deeper and begin with
        # shell keywords), and the donor-gate ERE literal contains
        # parentheses + a backslash — it never matches its own pattern
        # text.
        run: |
          wf=.github/workflows/phase6.yml
          if grep -qE '^  tier-donor:' "$wf"; then
            echo "VENUE-PIN-FAIL: the retired tier-donor leg was reintroduced — the x86_64 tier venue is tier-9k (Harvey's own kernel); the aarch64 donor gates stay LOCAL-only" >&2
            exit 1
          fi
          # 15-01: the prohibition scopes to the AARCH64 donor gate
          # scripts (build/aarch64/subset-*.sh) — the x64 tier driver
          # build/x86_64/subset-build.sh is the tier-2 compile leg's
          # own tool and is legal here
          if grep -qE 'build/aarch64/subset-(build|exec)\.sh' "$wf"; then
            echo "VENUE-PIN-FAIL: a 9front donor-gate script reference survives in phase6.yml — CI never provisions .build/9front-donor (maintainer direction 2026-11-05)" >&2
            exit 1
          fi
          if ! grep -qE '^  tier-9k:' "$wf"; then
            echo "VENUE-PIN-FAIL: the tier-9k job is missing — the x86_64 tier venue must be Harvey's own kernel (the 06-09 k10t1 pair)" >&2
            exit 1
          fi
          echo "VENUE-PIN-OK jobs: wave0-host tier-9k tier-r9 tier-2 x86_64-poolpanic"
      - name: FPdbleword region assert (D-01)
        # Sed the union region out of aarch64/include/u.h and require
        # exactly the two uint members (the amd64 reference shape);
        # any surviving ulong member is red.
        run: |
          region=$(sed -n '/^union FPdbleword/,/^};/p' aarch64/include/u.h)
          n=$(printf '%s\n' "$region" | grep -cE '^[[:space:]]+uint[[:space:]]+(lo|hi);')
          if [ "$n" -ne 2 ]; then
            echo "FPDBL-FAIL: want exactly the uint lo/hi members, found $n" >&2
            exit 1
          fi
          if printf '%s\n' "$region" | grep -q 'ulong'; then
            echo "FPDBL-FAIL: a ulong member survives in FPdbleword" >&2
            exit 1
          fi
          echo "FPDBL-OK"

  tier-r9:
    runs-on: ubuntu-latest
    timeout-minutes: 90 # TCG scale; the driver's per-stage 600s timeouts localize failures
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: install nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa
      - name: tier-1 r9 gate (boot-r9-tier1)
        run: nix run .#boot-r9-tier1
      - name: upload the retained gate log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tier-r9-log
          path: build/aarch64/tier1-r9.log
          if-no-files-found: warn

  tier-2:
    runs-on: ubuntu-latest
    timeout-minutes: 45 # host-only compile: setup + toolchain + the namespace tier build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: install nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa
      - name: host bin + toolchain provisioning
        # same missing-prerequisite class as tier-9k's provisioning:
        # subset-build.sh bootstraps itself when hostbin is absent, but
        # provisioning explicitly keeps the leg's failure surface at the
        # driver, not the bootstrap
        run: |
          nix run .#setup
          nix run .#toolchain
      - name: tier-0/1/2 compile + marker parity (15-01, USPACE-07)
        # The driver builds all three tiers in the Plan 9 namespace and
        # self-asserts (TIER-BUILD-OK + per-artifact magic checks);
        # this step additionally asserts the computed parity — T2-ART
        # marker count >= the tier-2 data's entry count (mk exit
        # status is never the gate; markers are).  On failure the log
        # tail lands in the step summary (D-16's convention).
        run: |
          mkdir -p .build
          # pipefail: the pipeline's status must be the driver's, not
          # tee's, or the failure handler below never fires.  rc is
          # captured with `|| rc=$?`: `if ! pipeline; then rc=$?` would
          # see the ! operator's status (always 0) and exit 0, skipping
          # the TIER-BUILD-OK gate below — a false green.
          set -o pipefail
          rc=0
          nix develop -c sh build/x86_64/subset-build.sh 2>&1 | tee .build/tier2-run.log || rc=$?
          if [ "$rc" -ne 0 ]; then
            { echo "## ❌ tier-2 compile failed (rc=$rc)"; echo '```'; tail -60 .build/subset-build-x64.log 2>/dev/null || tail -60 .build/tier2-run.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit "$rc"
          fi
          grep -q TIER-BUILD-OK .build/subset-build-x64.log
          n=$(awk 'NF && $1 !~ /^#/ {c++} END{print c+0}' build/x86_64/tiers/tier2-services.txt)
          m=$(grep -c '^T2-ART' .build/subset-build-x64.log || true)
          echo "tier-2 parity: entries=$n markers=$m"
          if [ "$m" -lt "$n" ]; then
            echo "TIER2-PARITY-FAIL: markers $m < entries $n" >&2
            exit 1
          fi
          echo "TIER2-COMPILE-OK (entries=$n markers=$m)"
      - name: upload the tier-2 build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tier2-build-log
          path: |
            .build/subset-build-x64.log
            .build/tier2-run.log
          if-no-files-found: warn

  tier-9k:
    runs-on: ubuntu-latest
    timeout-minutes: 90 # TCG-fallback scale; KVM expected — ubuntu-latest exposes /dev/kvm (the poolpanic leg's premise)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: install nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa
      - name: host bin + toolchain provisioning
        # nix/build.sh asserts pcc/cpp/ar in $HARVEY_LINUX_BIN before
        # building — provision them on the clean runner (the missing-
        # prerequisite class the first hosted run redded on), then
        # assert the products explicitly: toolchain.sh's trailing echo
        # masks sub-build failures (the 02-12 exit-0 class).
        run: |
          nix run .#setup
          nix run .#toolchain
          _a=$(uname -m); [ "$_a" = "arm64" ] && _a=aarch64
          hb=".build/hostbin-linux-$_a/bin"
          missing=0
          for t in pcc cpp ar 6c 6l 8c 8l; do
            if [ ! -x "$hb/$t" ]; then echo "TOOLCHAIN-MISSING: $hb/$t" >&2; missing=1; fi
          done
          if [ "$missing" -ne 0 ]; then echo "hostbin contents:" >&2; ls "$hb" >&2; exit 1; fi
          echo "TOOLCHAIN-PRODUCTS-OK ($hb)"
      - name: build amd64 userspace + kernels
        # 02-12 (deferred): .#build's break-glass tail reports exit 0
        # even when the build failed — assert the ARTIFACTS, and on
        # absence print the poolpanic step's BUILD-SWALLOWED-FAIL
        # digest so the swallowed failure is diagnosable from the job
        # log.
        run: |
          mkdir -p .build
          nix run .#build 2>&1 | tee .build/tier-9k-build.log
          missing=""
          for f in amd64/9k10cpu.elf amd64/bin/rc amd64/bin/awk; do
            if [ ! -f "$f" ]; then missing="$missing $f"; fi
          done
          if [ -n "$missing" ]; then
            log=.build/tier-9k-build.log
            echo "BUILD-SWALLOWED-FAIL: missing after nix run .#build:$missing (02-12 exit-0 class)" >&2
            echo "== bind-error context (they are noise on green hosts, but confirm):"
            grep -n -B2 -A2 'bind: No such' "$log" | head -24 || true
            echo "== ip/ipconfig lines in the build log:"
            grep -n 'ipconfig' "$log" | head -10 || echo "(none — ipconfig never touched)"
            echo "== all missing-make targets:"
            grep -nE "don't know how to make" "$log" | head -15 || echo "(none)"
            echo "== what the repo's amd64/bin holds after the build:"
            ls amd64/bin/ 2>&1 | head -10 || true
            ls amd64/bin/ip/ 2>&1 | head -10 || true
            echo "== first mk recipe failures (the abort-on-first-failure origin):"
            grep -n 'exit status=' "$log" | head -8 || echo "(none)"
            _first=$(grep -n -m1 'exit status=' "$log" | cut -d: -f1 || true)
            if [ -n "$_first" ]; then
              echo "== context around the first failure (line $_first):"
              sed -n "$((_first > 25 ? _first - 25 : 1)),$((_first + 3))p" "$log" || true
            fi
            echo "== last 30 lines:"
            tail -30 "$log" || true
            exit 1
          fi
      - name: build the k10t1 venue kernel
        # The script self-asserts its products and prints the embedded-
        # file count (43); on failure its tail lands in the step
        # summary (D-16's self-print convention — runner logs are
        # auth-gated).
        run: |
          nix develop -c sh build/mm/build-9k10t1.sh 2>&1 | tee .build/tier-9k-kernel-build.log || {
            rc=$?
            { echo "## ❌ k10t1 venue kernel build failed (rc=$rc)"; echo '```'; tail -60 .build/tier-9k-kernel-build.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit $rc
          }
      - name: boot 9k10t1 + tier sweep gate
        # The harness prints its marker-state digest + log tail to
        # stderr on failure — capture both into the step summary, then
        # the result file when present.  On green, cat the result file
        # into the log.
        run: |
          nix develop -c sh build/mm/boot-9k10t1-sweep.sh 2>&1 | tee .build/tier-9k-sweep.log || {
            rc=$?
            { echo "## ❌ tier-9k boot/sweep failed (rc=$rc)"; echo '```'; tail -120 .build/tier-9k-sweep.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            if [ -f .build/tier-9k-result.txt ]; then cat .build/tier-9k-result.txt; fi
            exit $rc
          }
          cat .build/tier-9k-result.txt
      - name: upload the venue logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tier-9k-logs
          path: |
            .build/tier-9k-serial.log
            .build/tier-9k-result.txt
            .build/tier-9k-build.log
          if-no-files-found: warn

  x86_64-poolpanic:
    runs-on: ubuntu-latest
    timeout-minutes: 45 # KVM when available; the script's own budgets localize TCG
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: install nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa
      - name: host bin + toolchain provisioning
        # nix/build.sh asserts pcc/cpp/ar in $HARVEY_LINUX_BIN before
        # building — provision them on the clean runner (same missing
        # prerequisite class as wave0-host's setup step).
        run: |
          nix run .#setup
          nix run .#toolchain
      - name: build 9k10cpu from the clean checkout (pswt-fixed 6c)
        # 02-12 (deferred): .#build's break-glass tail reports exit 0
        # even when the build failed — assert the ARTIFACT, and on
        # absence print a targeted failure digest so the swallowed
        # failure is diagnosable from the job log.
        run: |
          mkdir -p .build
          nix run .#build 2>&1 | tee .build/poolpanic-build.log
          if [ ! -f amd64/9k10cpu.elf ]; then
            log=.build/poolpanic-build.log
            echo "BUILD-SWALLOWED-FAIL: amd64/9k10cpu.elf missing after nix run .#build (02-12 exit-0 class)" >&2
            echo "== bind-error context (they are noise on green hosts, but confirm):"
            grep -n -B2 -A2 'bind: No such' "$log" | head -24 || true
            echo "== ip/ipconfig lines in the build log:"
            grep -n 'ipconfig' "$log" | head -10 || echo "(none — ipconfig never touched)"
            echo "== all missing-make targets:"
            grep -nE "don't know how to make" "$log" | head -15 || echo "(none)"
            echo "== what the repo's amd64/bin holds after the build:"
            ls amd64/bin/ 2>&1 | head -10 || true
            ls amd64/bin/ip/ 2>&1 | head -10 || true
            echo "== first mk recipe failures (the abort-on-first-failure origin):"
            grep -n 'exit status=' "$log" | head -8 || echo "(none)"
            _first=$(grep -n -m1 'exit status=' "$log" | cut -d: -f1 || true)
            if [ -n "$_first" ]; then
              echo "== context around the first failure (line $_first):"
              sed -n "$((_first > 25 ? _first - 25 : 1)),$((_first + 3))p" "$log" || true
            fi
            echo "== last 30 lines:"
            tail -30 "$log" || true
            exit 1
          fi
      - name: accel probe (recorded in the verdict file)
        # KVM iff /dev/kvm is writable, else TCG — exactly once per
        # run; the classification assertion set is identical on both
        # paths (the script probes again for its own run; this step
        # surfaces the runner's capability in the job log).
        run: |
          if [ -w /dev/kvm ]; then
            echo "accel=kvm (/dev/kvm writable)"
          else
            echo "accel=tcg (no writable /dev/kvm — 600s budgets)"
          fi
      - name: boot 9k10cpu + produce the verdict (USPACE-10)
        # The harness exits 0 iff a verdict was PRODUCED (banner seen +
        # classification written) — never gated on PASS.  No banner
        # (incl. an empty capture) records FAIL no-banner and reds the
        # leg.  The assert below is the job's verdict-production gate.
        run: |
          nix develop -c sh build/mm/boot-9k10cpu-qemu.sh
          test -f .build/poolpanic-verdict.txt
          grep -q '^VERDICT=' .build/poolpanic-verdict.txt
          cat .build/poolpanic-verdict.txt
      - name: upload the serial log + verdict
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: poolpanic-verdict
          path: |
            .build/poolpanic-serial.log
            .build/poolpanic-verdict.txt
          if-no-files-found: warn
