# r9-shell.yml — the GH Actions linux leg of the
# one-command boot.  A clean checkout of this repo reproduces the full
# pipeline on ubuntu-latest: install nix → nix run .#boot-r9-smoke —
# which builds the aarch64 userland (native `unshare` namespace build),
# bakes bootfs.paq with Harvey's own mkpaqfs, and boots
# the flake.lock-pinned r9 kernel (inputs.r9 = github:requaos/r9) under
# qemu TCG to the interactive /bin/rc prompt, asserting the whole
# command sweep (banner → paqfs… → stacksmoke → `% ` → echo/ls/ps/cat →
# DEL safety → init restart) via build/aarch64/smoke-r9.expect.
#
# CI-green means LINUX only — this
# workflow is the whole CI story.  The darwin leg is documented-manual
# (build/REPRODUCIBILITY.md names the exact commands);
# no darwin leg runs here.  Lands ALONGSIDE the legacy harvey.yml,
# which is untouched.
#
# Supply chain: the nix-install action is pinned to a full
# 40-char commit SHA, never a floating tag:
#   v23 == 3138316df39ed29be04236d7ffc686fa525866aa
# Permissions are the default checkout scope (contents: read) — the
# pipeline builds and boots locally; no extra tokens or secrets.

name: r9-shell

on: [push, pull_request]

permissions:
  contents: read

jobs:
  boot-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90 # TCG scale; the smoke's own per-stage 600s timeouts localize failures
    steps:
      - uses: actions/checkout@v4
      - name: install nix
        # pinned SHA (see header): the supply-chain rule
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa
      - name: boot r9 + harvey aarch64 userland smoke
        run: nix run .#boot-r9-smoke

  # 08-09 (D-16): the short NET gates run in hosted CI — the composed
  # net smoke (D-13) drives the user-visible flows through the packaged
  # kernel's devip #I tree in ONE boot: ping 127.0.0.1, udp echo, tcp/7
  # echo, ipconfig static + dhcp (the baked fixtures' markers, both
  # NOT-L2-TRUTH venue labels — slirp evidence is never L2 truth; the
  # tap verdict is Phase 9's joint gate).  The SUSTAINED soak stays
  # documented-manual on dev hosts (TCG on every automated venue) — the
  # exact invocation lives in build/aarch64/root-tree/lib/netip-soak.rc's
  # header and 08-EVIDENCE.md.
  # Supply chain (the 06-08 rule): this job's checkout is pinned to v4's
  # API-resolved commit — 11d5960a326750d5838078e36cf38b85af677262,
  # resolved via the GitHub API 2026-11-06 (repos/actions/checkout
  # refs/tags/v4 == commits?sha=v4) — and the nix-installer rides the
  # header's pinned SHA.  The boot-smoke job's `@v4` tag predates this
  # rule and stays as-is (not this plan's file region to churn).
  net-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90 # TCG scale; the smoke's own per-stage 600s timeouts localize failures
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 — API-resolved 2026-11-06 (the 06-08 rule)
      - name: install nix
        # pinned SHA (see header): the supply-chain rule
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa
      - name: composed net smoke (boot-r9-net-smoke)
        run: nix run .#boot-r9-net-smoke
